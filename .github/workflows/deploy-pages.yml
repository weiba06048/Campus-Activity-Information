# 构建 Vite + React 静态站点并发布到 GitHub Pages
# 发布产物：dist/client（构建时把资源前缀设为 /<仓库名>/）
name: Build and Deploy to GitHub Pages

on:
  # 推送到默认分支时发布
  push:
    branches: ["main"]

  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，且不打断正在进行的发布
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_BASE 决定 index.html 里资源引用的前缀，必须与仓库路径一致
      - name: Build static site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/client/index.html
          grep -q "/${{ github.event.repository.name }}/assets/" dist/client/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
